<style>
  :root{
    --navy:#0d1626; --navy2:#111d33; --surface:#16243d; --surface2:#1c2e4c;
    --line:rgba(255,255,255,0.08); --gold:#ffcc33; --gold-dim:rgba(255,204,51,0.15);
    --gold-mid:rgba(255,204,51,0.35);
    --blue:#4fd6ff; --text:#eef3fb; --muted:#8ea0bf;
    --b1:#4fd6ff; --b2:#7cffb2; --b3:#ffcc33; --b4:#ff8a5c;
    --green:#7cffb2; --orange:#ff8a5c; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--navy);color:var(--text);font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
  body{padding-bottom:110px;}
  h1,h2,h3{font-family:'Oswald',sans-serif;margin:0;letter-spacing:0.01em;}
  .app{max-width:640px;margin:0 auto;padding:0 14px;}

  /* ── HEADER ── */
  header.top{
    background:linear-gradient(160deg, var(--navy2) 0%, #0a1220 100%);
    padding:14px 14px 0;
    border-bottom:2px solid var(--gold-dim);
    position:sticky; top:0; z-index:20;
  }
  .brand{
    display:flex; align-items:center; justify-content:space-between;
    max-width:640px; margin:0 auto; padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .brand-logo{height:44px; width:auto; display:block;}
  .brand-right{text-align:right;}
  .brand-right .coach{font-size:10px; color:var(--gold); letter-spacing:0.14em; text-transform:uppercase; font-weight:700;}
  .brand-right .date{font-size:10px; color:var(--muted); letter-spacing:0.06em;}

  .athlete{
    max-width:640px; margin:8px auto 0; font-size:13px; color:var(--muted);
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:10px;
  }
  .athlete b{color:var(--text);}
  .gear{
    background:transparent; border:1px solid var(--line);
    color:var(--muted); border-radius:8px; padding:5px 9px; font-size:12px;
  }

  nav.days{display:flex; gap:8px; max-width:640px; margin:10px auto 0; padding:0;}
  .day-btn{
    flex:1; padding:10px 0; text-align:center; border-radius:10px 10px 0 0;
    background:var(--surface); border:1px solid var(--line); border-bottom:none;
    color:var(--muted); font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    transition:all 0.15s;
  }
  .day-btn.active{background:var(--gold); color:#0d1626; border-color:var(--gold);}

  .view-toggle{display:flex; gap:8px; margin:0 auto; max-width:640px; padding:10px 0 12px;}
  .view-toggle button{
    flex:1; padding:8px 0; border-radius:20px; border:1px solid var(--line);
    background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; letter-spacing:0.03em;
  }
  .view-toggle button.active{background:var(--surface2); color:var(--gold); border-color:var(--gold-dim);}

  /* ── WEEK STRIP ── */
  .weekstrip{display:flex; gap:6px; overflow-x:auto; padding:14px 0 4px; scrollbar-width:none;}
  .weekstrip::-webkit-scrollbar{display:none;}
  .wk{
    flex:0 0 auto; width:42px; height:46px; border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--line);
    font-size:13px; font-weight:700; color:var(--text); cursor:pointer; position:relative;
  }
  .wk small{font-size:8px; color:var(--muted); font-weight:600; margin-top:1px;}
  .wk.active{outline:2px solid var(--gold); background:var(--surface2);}
  .wk .dot{position:absolute; top:4px; right:4px; width:6px; height:6px; border-radius:50%;}

  /* ── BLOCCO BANNER ── */
  .blocco-banner{
    margin:8px 0 0; padding:10px 12px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; gap:10px; font-size:12.5px;
  }
  .blocco-banner .chip{
    padding:3px 9px; border-radius:20px;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; color:#0d1626;
  }
  .blocco-banner .desc{color:var(--muted); flex:1;}

  /* ── DAY TITLE ── */
  .daytitle{padding:16px 0 4px;}
  .daytitle h2{font-size:19px; color:var(--text);}
  .daytitle .foc{font-size:12.5px; color:var(--muted); margin-top:2px;}

  /* ── WARM-UP ── */
  .warmup-section{
    margin:12px 0 0; background:var(--surface);
    border:1px solid var(--gold-dim); border-radius:var(--radius); overflow:hidden;
  }
  .warmup-header{
    background:linear-gradient(90deg, rgba(255,204,51,0.15), transparent);
    padding:10px 14px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; user-select:none;
  }
  .warmup-header .wu-title{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:13px;
    color:var(--gold); letter-spacing:0.06em; text-transform:uppercase;
  }
  .warmup-header .wu-sub{font-size:11px; color:var(--muted);}
  .warmup-header .wu-chevron{color:var(--gold); font-size:14px; transition:transform 0.2s;}
  .warmup-header.open .wu-chevron{transform:rotate(180deg);}
  .warmup-body{display:none; padding:10px 14px 14px;}
  .warmup-body.open{display:block;}
  .wu-phase{margin-bottom:12px;}
  .wu-phase:last-child{margin-bottom:0;}
  .wu-phase-title{
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--blue); font-weight:700; margin-bottom:6px;
  }
  .wu-item{
    display:flex; align-items:baseline; gap:8px;
    font-size:12.5px; color:var(--text); padding:4px 0;
    border-bottom:1px solid var(--line);
  }
  .wu-item:last-child{border-bottom:none;}
  .wu-item .wu-ex{flex:1;}
  .wu-item .wu-detail{font-size:11px; color:var(--gold); font-weight:600; white-space:nowrap;}
  .wu-item .wu-note{font-size:11px; color:var(--muted); display:block; margin-top:1px;}

  /* ── EXERCISES ── */
  .group-label{
    margin:18px 0 8px; font-size:11px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--blue); font-weight:700;
  }
  .exercise{
    margin:0 0 12px; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  .ex-head{padding:12px 14px 10px; display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
  .ex-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; line-height:1.25;}
  .ex-note{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .ex-tag{
    display:inline-block; margin-top:3px; padding:2px 7px; border-radius:20px;
    background:var(--gold-dim); color:var(--gold);
    font-size:9.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
  }
  .ex-target{flex:0 0 auto; text-align:right; font-size:11px; color:var(--gold); font-weight:700; white-space:nowrap;}
  .ex-target .rec{display:block; color:var(--muted); font-weight:500; margin-top:2px;}

  .sets{padding:0 10px 10px;}
  .set-row{display:flex; align-items:center; gap:8px; padding:6px 4px;}
  .set-row .idx{width:20px; text-align:center; font-size:12px; color:var(--muted); font-weight:700;}
  .set-row input{
    flex:1; min-width:0; background:var(--navy2); border:1px solid var(--line);
    border-radius:9px; color:var(--text); font-size:16px; padding:9px 8px;
    text-align:center; font-family:'Inter',sans-serif;
  }
  .set-row input:focus{outline:none; border-color:var(--gold);}
  .set-row .unit{font-size:10px; color:var(--muted); width:26px;}
  .add-set{
    margin:2px 4px 6px; width:calc(100% - 8px); padding:8px;
    border-radius:9px; border:1px dashed var(--line);
    background:transparent; color:var(--muted); font-size:12px; font-weight:600;
  }

  /* ── NOTES BOX ── */
  .notes-box{
    margin:6px 0 20px; padding:12px 14px; background:var(--surface2);
    border-radius:12px; border-left:3px solid var(--gold);
  }
  .notes-box h3{
    font-size:10px; color:var(--gold); letter-spacing:0.12em;
    text-transform:uppercase; margin-bottom:8px;
  }
  .notes-box ul{margin:0; padding-left:16px; font-size:12.5px; color:var(--text); line-height:1.55;}
  .notes-box li{margin-bottom:6px;}

  /* ── BOTTOM BAR ── */
  .bar{
    position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(0deg, var(--navy) 60%, transparent);
    padding:18px 14px 14px; z-index:30;
  }
  .barinner{max-width:640px; margin:0 auto; display:flex; gap:10px;}
  .save-btn{
    flex:1; padding:15px 0; border-radius:14px;
    background:var(--gold); color:#0d1626; border:none;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.04em;
  }
  .save-btn:active{transform:scale(0.98); background:#e6b82e;}

  /* ── TOAST ── */
  .toast{
    position:fixed; bottom:92px; left:50%;
    transform:translateX(-50%) translateY(10px); opacity:0;
    background:var(--surface2); border:1px solid var(--gold-dim);
    color:var(--gold); padding:9px 18px; border-radius:20px;
    font-size:13px; font-weight:600; transition:all 0.25s ease;
    z-index:40; pointer-events:none; max-width:85vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ── STORICO ── */
  .storico-item{
    margin:0 0 10px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:12px 14px;
  }
  .storico-item .row1{display:flex; justify-content:space-between; align-items:center;}
  .storico-item .day-tag{font-family:'Oswald',sans-serif; font-weight:700; font-size:13px;}
  .storico-item .wk-tag{font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .sync-dot{width:7px; height:7px; border-radius:50%;}
  .sync-dot.synced{background:var(--green);}
  .sync-dot.pending{background:var(--orange);}
  .storico-item .summary{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.5;}
  .empty{margin:40px 0; text-align:center; color:var(--muted); font-size:13px;}

  .action-btn{
    margin:16px 0 6px; width:100%; padding:13px 0; border-radius:12px;
    border:1px solid var(--gold-dim); background:var(--surface2);
    color:var(--gold); font-family:'Oswald',sans-serif; font-weight:700;
    font-size:14px; letter-spacing:0.02em;
  }
  .action-btn.secondary{border-color:var(--line); color:var(--blue);}
  .action-hint{margin:4px 0 16px; font-size:11px; color:var(--muted); text-align:center; line-height:1.5;}

  /* ── SETTINGS ── */
  .settings-panel{
    margin:16px 0; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; padding:14px;
  }
  .settings-panel h3{
    font-size:12px; color:var(--gold); letter-spacing:0.1em;
    text-transform:uppercase; margin-bottom:10px;
  }
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
  .field input{
    width:100%; background:var(--navy2); border:1px solid var(--line);
    border-radius:9px; color:var(--text); font-size:14px; padding:10px;
  }
  .field-hint{font-size:10.5px; color:var(--muted); margin-top:4px; line-height:1.4;}
  .roadmap{
    margin:0 0 20px; padding:12px 14px; background:var(--surface2);
    border-radius:12px; border:1px dashed var(--line);
    font-size:11.5px; color:var(--muted); line-height:1.6;
  }
  .roadmap b{color:var(--text);}

  /* ── PWA install banner ── */
  #installBanner{
    display:none; margin:0 0 10px; padding:11px 14px;
    background:linear-gradient(90deg, var(--gold-dim), transparent);
    border:1px solid var(--gold-mid); border-radius:12px;
    font-size:12.5px; color:var(--text);
    align-items:center; gap:10px;
  }
  #installBanner.show{display:flex;}
  #installBtn{
    margin-left:auto; flex:0 0 auto; padding:7px 14px; border-radius:20px;
    background:var(--gold); color:#0d1626; border:none;
    font-family:'Oswald',sans-serif; font-weight:700; font-size:12px;
  }
  #dismissInstall{
    background:transparent; border:none; color:var(--muted);
    font-size:16px; padding:0 4px; cursor:pointer;
  }
</style>
</head>

function blockOf(w){ return w<=3?'B1':w<=6?'B2':w<=9?'B3':'B4'; }

const PREFIX='fr_mauro_';
function getSettings(){
  try{ const r=localStorage.getItem(PREFIX+'settings'); if(r) return JSON.parse(r); }catch(e){}
  return {user:'Mauro Spaggiari',piUrl:''};
}
function saveSettings(s){ localStorage.setItem(PREFIX+'settings',JSON.stringify(s)); }

let settings=getSettings();
let state={day:'A',week:1,view:'log',entries:{}};

const app=document.getElementById('app');
const dayNav=document.getElementById('dayNav');
const toast=document.getElementById('toast');
const bar=document.getElementById('bar');
document.getElementById('userLabel').textContent=settings.user;

['A','B','C'].forEach(d=>{
  const b=document.createElement('button');
  b.className='day-btn'+(d===state.day?' active':'');
  b.textContent='Giorno '+d;
  b.onclick=()=>{state.day=d;loadEntry();render();};
  b.dataset.day=d;
  dayNav.appendChild(b);
});

document.getElementById('viewToggle').addEventListener('click',e=>{
  const btn=e.target.closest('button');
  if(!btn)return;
  state.view=btn.dataset.view;
  render();
});
document.getElementById('gearBtn').addEventListener('click',()=>{state.view='settings';render();});
document.getElementById('saveBtn').addEventListener('click',saveEntry);

function entryKey(d,w){return `${PREFIX}entry_${d}_${String(w).padStart(2,'0')}`;}
function indexKey(){return PREFIX+'sessions_index';}

function loadEntry(){
  state.entries={};
  try{
    const raw=localStorage.getItem(entryKey(state.day,state.week));
    if(raw){ const p=JSON.parse(raw); state.entries=p.entries||{}; }
  }catch(e){}
}

function saveEntry(){
  const payload={day:state.day,week:state.week,blocco:blockOf(state.week),savedAt:new Date().toISOString(),entries:collectFromDOM(),synced:false};
  try{
    localStorage.setItem(entryKey(state.day,state.week),JSON.stringify(payload));
    let idx=[];
    try{const r=localStorage.getItem(indexKey());if(r)idx=JSON.parse(r);}catch(e){}
    const id=`${state.day}-${state.week}`;
    idx=idx.filter(x=>x.id!==id);
    idx.push({id,day:state.day,week:state.week,blocco:payload.blocco,savedAt:payload.savedAt,synced:false});
    localStorage.setItem(indexKey(),JSON.stringify(idx));
    showToast('✓ Sessione salvata');
    state.entries=payload.entries;
  }catch(e){showToast('Errore nel salvataggio');}
}

function collectFromDOM(){
  const out={};
  document.querySelectorAll('.exercise').forEach(card=>{
    const name=card.dataset.name;
    const rows=[];
    card.querySelectorAll('.set-row').forEach(row=>{
      rows.push({w:row.querySelector('.w-input').value,r:row.querySelector('.r-input').value});
    });
    out[name]=rows;
  });
  return out;
}

function showToast(msg='Salvato'){
  toast.textContent=msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),2200);
}

function warmupHtml(day){
  const wu=WARMUP[day];
  let phasesHtml='';
  wu.phases.forEach(phase=>{
    let itemsHtml=phase.items.map(item=>`
      <div class="wu-item">
        <div class="wu-ex">
          ${item.ex}
          ${item.note?`<span class="wu-note">${item.note}</span>`:''}
        </div>
        <span class="wu-detail">${item.detail}</span>
      </div>`).join('');
    phasesHtml+=`<div class="wu-phase"><div class="wu-phase-title">${phase.title}</div>${itemsHtml}</div>`;
  });
  return `
    <div class="warmup-section">
      <div class="warmup-header" id="wuHeader">
        <div>
          <div class="wu-title">🔥 Riscaldamento specifico</div>
          <div class="wu-sub">${wu.duration} · espandere per vedere il protocollo</div>
        </div>
        <span class="wu-chevron">▼</span>
      </div>
      <div class="warmup-body" id="wuBody">${phasesHtml}</div>
    </div>`;
}

  const saved=(state.entries[ex.name])||[];

  const rowCount=Math.max(defCount,saved.length);

  for(let i=0;i<rowCount;i++){
    const sw=saved[i]?.w??'';
    const sr=saved[i]?.r??'';
    rowsHtml+=`<div class="set-row">
      <div class="idx">${i+1}</div>
      <input class="w-input" type="number" inputmode="decimal" placeholder="kg" value="${sw}">
      <span class="unit">kg</span>
      <input class="r-input" type="number" inputmode="numeric" placeholder="reps" value="${sr}">
      <span class="unit">reps</span>
    </div>`;
  }
  return `<div class="exercise" data-name="${ex.name.replace(/"/g,'&quot;')}">
    <div class="ex-head">
      <div>
        <div class="ex-name">${ex.name}</div>
        <div class="ex-note">${ex.note}</div>
        <span class="ex-tag">${ex.tag}</span>
      </div>
      <div class="ex-target">${ex.t[blocco]}<span class="rec">rec. ${ex.r[blocco]}</span></div>
    </div>
    <div class="sets">${rowsHtml}<button class="add-set" data-name="${ex.name.replace(/"/g,'&quot;')}">+ serie</button></div>
  </div>`;
}

function render(){
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===state.day));
  document.querySelectorAll('#viewToggle button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
  bar.style.display=state.view==='log'?'block':'none';

  if(state.view==='storico'){renderStorico();return;}
  if(state.view==='settings'){renderSettings();return;}

  const d=DATA[state.day];
  const blocco=blockOf(state.week);

  let weekDots='';
  for(let w=1;w<=12;w++){
    const bc=blockOf(w);
    weekDots+=`<div class="wk ${w===state.week?'active':''}" data-week="${w}">
      <span>${w}</span><small>${bc}</small>
      <span class="dot" style="background:${BLOCK_COLOR[bc]}"></span>
    </div>`;
  }

  let html=`
    <div class="weekstrip" id="weekstrip">${weekDots}</div>
    <div class="blocco-banner">
      <span class="chip" style="background:${BLOCK_COLOR[blocco]}">${blocco}</span>
      <span class="desc">${BLOCK_DESC[blocco]}</span>
    </div>
    <div class="daytitle"><h2>${d.title}</h2><div class="foc">${d.focus}</div></div>
    ${warmupHtml(state.day)}
  `;

  d.exercises.forEach(ex=>{html+=exerciseCard(ex,blocco);});
  html+=`<div class="group-label">Core</div>`;
  d.core.forEach(ex=>{html+=exerciseCard(ex,blocco);});
  html+=`<div class="group-label">Finisher condizionamento</div>`;
  d.finisher.forEach(ex=>{html+=exerciseCard(ex,blocco);});
  html+=`<div class="notes-box"><h3>⚠ Note tecniche — ${d.title}</h3><ul>${d.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div>`;

  app.innerHTML=html;

  document.getElementById('weekstrip').addEventListener('click',e=>{
    const wk=e.target.closest('.wk');
    if(!wk)return;
    state.week=parseInt(wk.dataset.week,10);
    loadEntry();render();
  });

  const wuHeader=document.getElementById('wuHeader');
  const wuBody=document.getElementById('wuBody');
  if(wuHeader){
    wuHeader.addEventListener('click',()=>{
      wuHeader.classList.toggle('open');
      wuBody.classList.toggle('open');
    });
  }

  document.querySelectorAll('.add-set').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const idx=btn.parentElement.querySelectorAll('.set-row').length+1;
      const row=document.createElement('div');
      row.className='set-row';
      row.innerHTML=`<div class="idx">${idx}</div>
        <input class="w-input" type="number" inputmode="decimal" placeholder="kg">
        <span class="unit">kg</span>
        <input class="r-input" type="number" inputmode="numeric" placeholder="reps">
        <span class="unit">reps</span>`;
      btn.parentElement.insertBefore(row,btn);
    });
  });

  const activeWk=document.querySelector('.wk.active');
  if(activeWk) activeWk.scrollIntoView({inline:'center',block:'nearest'});
}

function renderSettings(){
  app.innerHTML=`
    <div class="settings-panel">
      <h3>Profilo atleta</h3>
      <div class="field">
        <label>Nome</label>
        <input id="setUser" value="${settings.user}">
      </div>
    </div>
    <div class="settings-panel">
      <h3>Sincronizzazione backend (JellyRoger Pi)</h3>
      <div class="field">
        <label>Indirizzo backend</label>
        <input id="setPiUrl" placeholder="https://scheda.jellyroger.cv" value="${settings.piUrl}">
        <div class="field-hint">Lascia vuoto finché il backend sul Pi non è pronto. L'app salva tutto sul telefono anche offline.</div>
      </div>
      <button class="action-btn" id="saveSettingsBtn" style="margin:6px 0 0;">Salva impostazioni</button>
    </div>
    <div class="roadmap">
      <b>Prossimi step (quando il Pi sarà raggiungibile):</b><br>
      · Sync automatica sessioni verso archivio Pi<br>
      · Export PDF con impaginazione originale del programma<br>
      · Statistiche progressione carichi per blocco<br>
      · Importazione peso corporeo da Garmin Connect
    </div>
  `;
  document.getElementById('saveSettingsBtn').addEventListener('click',()=>{
    settings.user=document.getElementById('setUser').value.trim()||'Mauro Spaggiari';
    settings.piUrl=document.getElementById('setPiUrl').value.trim().replace(/\/+$/,'');
    saveSettings(settings);
    document.getElementById('userLabel').textContent=settings.user;
    showToast('✓ Impostazioni salvate');
  });
}

function renderStorico(){
  let idx=[];
  try{const r=localStorage.getItem(indexKey());if(r)idx=JSON.parse(r);}catch(e){}
  if(idx.length===0){
    app.innerHTML=`<div class="empty">Nessuna sessione salvata.<br>Compila e salva un allenamento per vederlo qui.</div>`;
    return;
  }
  idx.sort((a,b)=>new Date(b.savedAt)-new Date(a.savedAt));
  const pendingCount=idx.filter(x=>!x.synced).length;

  let html=`<div style="padding:16px 0 4px;"><h2 style="font-size:17px;">Storico sessioni</h2></div>`;
  html+=`<button class="action-btn" id="exportBtn">⬇ Esporta backup Excel (.xlsx)</button>
    <div class="action-hint">Genera un file Excel con tutte le sessioni — backup offline indipendente.</div>`;
  html+=`<button class="action-btn secondary" id="syncBtn">⇄ Sincronizza con il Pi${pendingCount?` (${pendingCount} in attesa)`:' (tutto sincronizzato)'}</button>
    <div class="action-hint">${settings.piUrl?`Backend: ${settings.piUrl}`:"Imposta l'indirizzo del Pi in Impostazioni per attivare la sync."}</div>`;

  for(const item of idx){
    let entryData=null;
    try{const r=localStorage.getItem(entryKey(item.day,item.week));if(r)entryData=JSON.parse(r);}catch(e){}
    const dateStr=new Date(item.savedAt).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
    let summary='';
    if(entryData){
      const exNames=Object.keys(entryData.entries).filter(k=>entryData.entries[k].some(s=>s.w||s.r));
      summary=exNames.slice(0,3).map(n=>{
        const sets=entryData.entries[n].filter(s=>s.w||s.r).map(s=>`${s.w||'-'}kg×${s.r||'-'}`).join(', ');
        return `<b style="color:var(--text)">${n}:</b> ${sets}`;
      }).join('<br>');
      if(exNames.length>3) summary+=`<br>+ altri ${exNames.length-3} esercizi`;
      if(exNames.length===0) summary='Nessun dato inserito.';
    }
    html+=`<div class="storico-item">
      <div class="row1">
        <span class="day-tag">Giorno ${item.day} · Sett. ${item.week}</span>
        <span class="wk-tag"><span class="sync-dot ${item.synced?'synced':'pending'}"></span>${item.blocco} · ${dateStr}</span>
      </div>
      <div class="summary">${summary}</div>
    </div>`;
  }
  app.innerHTML=html;
  document.getElementById('exportBtn').addEventListener('click',exportExcel);
  document.getElementById('syncBtn').addEventListener('click',syncWithPi);
}

async function syncWithPi(){
  if(!settings.piUrl){showToast("Imposta prima l'indirizzo del Pi");return;}
  let idx=[];
  try{const r=localStorage.getItem(indexKey());if(r)idx=JSON.parse(r);}catch(e){}
  const pending=idx.filter(x=>!x.synced);
  if(pending.length===0){showToast('Tutto già sincronizzato');return;}
  showToast(`Sincronizzo ${pending.length} sessioni…`);
  let ok=0,fail=0;
  for(const item of pending){
    try{
      const raw=localStorage.getItem(entryKey(item.day,item.week));
      const ed=raw?JSON.parse(raw):null;
      if(!ed)continue;
      const res=await fetch(`${settings.piUrl}/api/entry`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({user:settings.user,day:item.day,week:item.week,blocco:item.blocco,entries:ed.entries})
      });
      if(!res.ok)throw new Error();
      item.synced=true;ed.synced=true;
      localStorage.setItem(entryKey(item.day,item.week),JSON.stringify(ed));
      ok++;
    }catch(e){fail++;}
  }
  const newIdx=idx.map(x=>{const m=pending.find(p=>p.id===x.id);return m?{...x,synced:m.synced}:x;});
  localStorage.setItem(indexKey(),JSON.stringify(newIdx));
  showToast(fail===0?`✓ Sincronizzate ${ok} sessioni`:`${ok} ok, ${fail} fallite`);
  render();
}

function exportExcel(){
  if(typeof XLSX==='undefined'){showToast('Serve connessione internet');return;}
  let idx=[];
  try{const r=localStorage.getItem(indexKey());if(r)idx=JSON.parse(r);}catch(e){}
  if(idx.length===0){showToast('Nessun dato da esportare');return;}
  const rows=[];
  idx.sort((a,b)=>new Date(a.savedAt)-new Date(b.savedAt));
  for(const item of idx){
    let ed=null;
    try{const r=localStorage.getItem(entryKey(item.day,item.week));if(r)ed=JSON.parse(r);}catch(e){}
    if(!ed)continue;
    const dateStr=new Date(item.savedAt).toLocaleDateString('it-IT');
    Object.keys(ed.entries).forEach(exName=>{
      ed.entries[exName].forEach((s,i)=>{
        if(!s.w&&!s.r)return;
        rows.push({'Utente':settings.user,'Data':dateStr,'Giorno':item.day,'Settimana':item.week,'Blocco':item.blocco,'Esercizio':exName,'Serie':i+1,'Kg':s.w||'','Reps':s.r||'','Sync':item.synced?'Sì':'No'});
      });
    });
  }
  if(rows.length===0){showToast('Nessun dato compilato');return;}
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=[{wch:16},{wch:12},{wch:8},{wch:10},{wch:8},{wch:28},{wch:7},{wch:6},{wch:6},{wch:6}];
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Storico');
  XLSX.writeFile(wb,`FR_Mauro_backup_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('✓ Backup Excel scaricato');
}

// ── PWA Install prompt ──
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  const banner=document.getElementById('installBanner');
  if(banner)banner.classList.add('show');
});

// ── Service Worker ──
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    const swCode=`
const CACHE='fr-v2';
const ASSETS=['./'];
self.addEventListener('install',e=>{
  e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()));
});
self.addEventListener('activate',e=>{
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));
});
self.addEventListener('fetch',e=>{
  e.respondWith(caches.match(e.request).then(cached=>cached||fetch(e.request).catch(()=>caches.match('./'))));
});
    `;
    const blob=new Blob([swCode],{type:'application/javascript'});
    const swUrl=URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl).then(()=>console.log('SW registrato')).catch(()=>{
      // fallback: SW non supportato, app funziona comunque
    });
  });
}

loadEntry();
render();
</script>
